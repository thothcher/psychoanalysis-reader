<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>ფსიქოანალიზის რიდერი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700;800&display=swap">
<style>
/* Layout: sticky icon tab rail over one 1120px column; solid white panels with soft shadows float on a cool grey ground. No borders, no radii. */
:root{
  --bg:#ECEFF3;
  --surface:#FFFFFF;
  --surface-2:#F5F6F8;
  --surface-3:#E3E7EC;
  --ink:#18202E;
  --muted:#566173;
  --faint:#8A93A3;
  --accent:#24325F;
  --accent-soft:#DDE3F2;
  --on-dark:#FFFFFF;
  --good:#2D7A4C;
  --good-bg:#E2F1E8;
  --bad:#B03A3A;
  --bad-bg:#F7E3E3;
  --gold:#B8862B;
  --shadow-1:0 1px 2px rgba(24,32,46,.06),0 3px 10px rgba(24,32,46,.05);
  --shadow-2:0 2px 4px rgba(24,32,46,.07),0 12px 30px rgba(24,32,46,.10);
  --f-display:"Noto Serif Georgian",Sylfaen,Georgia,serif;
  --f-body:"Noto Sans Georgian",Sylfaen,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
select{font:inherit;color:var(--ink);background:var(--surface);border:0;box-shadow:var(--shadow-1);padding:9px 12px}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:15px;height:15px}
.i-lg{width:22px;height:22px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.4vw,25px);font-weight:700}
h3{font-size:18px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.tab-nums{font-variant-numeric:tabular-nums}

/* Header */
.top{padding-block:28px 18px}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.brand-mark{width:52px;height:52px;background:var(--accent);color:var(--on-dark);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-1)}
.brand-mark .i{width:28px;height:28px}
.brand p{color:var(--muted);max-width:60ch;margin-top:4px}
.progress-strip{display:flex;gap:10px;flex-wrap:wrap}
.pstat{background:var(--surface);box-shadow:var(--shadow-1);padding:8px 14px;display:flex;flex-direction:column;min-width:96px}
.pstat b{font-family:var(--f-display);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.pstat span{font-size:12px;color:var(--muted)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;box-shadow:0 6px 14px -12px rgba(24,32,46,.35)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:10px 11px;white-space:nowrap;font-weight:600;color:var(--muted);background:transparent;transition:background .15s,color .15s}
.tab:hover{background:var(--surface);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-dark);box-shadow:var(--shadow-1)}

main{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px}
.view-head p{color:var(--muted);max-width:68ch;margin-top:6px}

/* Generic */
.panel{background:var(--surface);box-shadow:var(--shadow-1);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--surface);box-shadow:var(--shadow-1);font-weight:600;transition:transform .12s,box-shadow .12s,background .15s;min-height:42px}
.btn:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:var(--on-dark)}
.btn.good{background:var(--good);color:var(--on-dark)}
.btn.bad{background:var(--bad);color:var(--on-dark)}
.btn.flat{box-shadow:none;background:var(--surface-2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);box-shadow:var(--shadow-1);font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-dark)}
.chip .dot{width:10px;height:10px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.mono{display:grid;place-items:center;color:var(--on-dark);font-family:var(--f-display);font-weight:800;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;background:var(--surface-2);color:var(--muted)}
.bar{height:6px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-dark);padding:10px 18px;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Overview */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.hero-lead{display:flex;flex-direction:column;gap:14px}
.hero-lead p{font-size:16px;max-width:62ch}
.plan{display:flex;flex-direction:column;gap:2px}
.plan-step{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;background:var(--surface-2);text-align:left;transition:background .15s}
.plan-step:hover{background:var(--accent-soft)}
.plan-step .n{width:28px;height:28px;background:var(--accent);color:var(--on-dark);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.plan-step b{display:block}
.plan-step span{font-size:13px;color:var(--muted)}
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.school{background:var(--surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column}
.school-head{padding:12px 16px;color:var(--on-dark);font-family:var(--f-display);font-weight:700;font-size:15px}
.school-list{display:flex;flex-direction:column;padding:6px}
.person{display:flex;gap:12px;align-items:center;padding:8px 10px;text-align:left;transition:background .15s}
.person:hover{background:var(--surface-2)}
.person .mono{width:34px;height:34px;font-size:13px}
.person b{display:block;font-size:14px;line-height:1.3}
.person span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.split-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.split{background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:4px}
.split .yr{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.epithets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.epithet{padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.epithet q{font-family:var(--f-display);font-weight:700;font-size:16px;quotes:"„" "“"}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:38px;height:38px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tip p{font-size:14px;color:var(--muted)}

/* Timeline */
.tl-scroll{overflow-x:auto}
.tl{position:relative;min-width:820px;padding-top:28px}
.tl-axis{position:absolute;inset:0 0 auto 0;height:22px}
.tl-tick{position:absolute;top:0;font-size:12px;color:var(--faint);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;top:24px;bottom:0;width:1px;background:var(--surface-3)}
.tl-event{position:absolute;top:24px;bottom:0;width:2px;background:var(--gold);opacity:.55}
.tl-event span{position:absolute;bottom:100%;left:4px;font-size:11px;color:var(--gold);white-space:nowrap;font-weight:600}
.tl-row{position:relative;height:28px;margin-bottom:4px}
.tl-bar{position:absolute;top:0;height:26px;color:var(--on-dark);font-size:12.5px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow-1);transition:transform .12s}
.tl-bar:hover{transform:translateY(-1px)}

/* Thinkers */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow-1);padding:0 12px;min-height:40px;flex:1 1 220px;max-width:340px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;padding:8px 0}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.tcard{background:var(--surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column;min-width:0;scroll-margin-top:80px;transition:box-shadow .2s}
.tcard.flash{box-shadow:0 0 0 3px var(--gold),var(--shadow-2)}
.tc-head{display:flex;gap:14px;align-items:center;padding:18px 20px 12px}
.tc-head .mono{width:52px;height:52px;font-size:18px}
.tc-head .meta{font-size:13px;color:var(--muted)}
.tc-body{padding:0 20px 18px;display:flex;flex-direction:column;gap:14px}
.essence{font-size:15px}
.hookbox{background:var(--surface-2);padding:12px 14px;display:flex;gap:12px}
.hookbox .i{color:var(--gold);margin-top:3px}
.hookbox div{display:flex;flex-direction:column;gap:6px;min-width:0}
.hookbox p{font-size:14px}
.hookbox b{font-weight:700}
details.more{background:var(--surface-2)}
details.more > summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary .chev{margin-left:auto;transition:transform .2s}
details.more[open] > summary .chev{transform:rotate(180deg)}
details.more > .inner{padding:2px 14px 14px}
dl.concepts{margin:0;display:flex;flex-direction:column;gap:10px}
dl.concepts dt{font-weight:700;font-size:14px}
dl.concepts dd{margin:0;font-size:14px;color:var(--muted)}
ul.bio{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.tc-actions{display:flex;flex-wrap:wrap;gap:8px}
.minor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.minor{background:var(--surface);box-shadow:var(--shadow-1);padding:14px 16px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:80px}
.minor .who{display:flex;gap:10px;align-items:center}
.minor .who .mono{width:30px;height:30px;font-size:12px}
.minor p{font-size:13.5px;color:var(--muted)}
.minor ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--muted)}
.extra{display:flex;flex-direction:column;gap:8px}
.mini-table{width:100%;border-collapse:collapse;font-size:13.5px}
.mini-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px}
.mini-table td{padding:7px 8px;vertical-align:top}
.mini-table tr:nth-child(even) td{background:var(--surface-2)}
.tbl-scroll{overflow-x:auto}
.horney{display:flex;flex-direction:column;gap:6px}
.horney div{display:flex;gap:12px;align-items:center;background:var(--surface-2);padding:8px 12px;font-size:14px}
.horney svg{width:54px;height:22px;flex:none}
.jung-fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}

/* Compare */
.cmp-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.cmp-menu{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
.cmp-item{text-align:left;padding:11px 14px;background:var(--surface);box-shadow:var(--shadow-1);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;transition:background .15s}
.cmp-item:hover{background:var(--surface-2)}
.cmp-item[aria-pressed="true"]{background:var(--accent);color:var(--on-dark)}
.cmp-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cmp-summary{display:flex;gap:14px;align-items:flex-start}
.cmp-summary .i{color:var(--gold);margin-top:4px}
.cmp-summary p{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.5}
.cmp-scroll{overflow-x:auto;background:var(--surface);box-shadow:var(--shadow-1)}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.cmp th,table.cmp td{padding:12px 14px;vertical-align:top;text-align:left}
table.cmp thead th{color:var(--on-dark);font-family:var(--f-display);font-weight:700;font-size:15px}
table.cmp thead th:first-child{background:var(--ink)}
table.cmp tbody th{font-weight:700;font-size:13px;color:var(--muted);width:150px;background:var(--surface-2);position:sticky;left:0;z-index:1}
table.cmp tbody tr:nth-child(even) td{background:#FAFBFC}
table.cmp td{transition:background .15s,color .15s}
.selftest table.cmp td:not(.shown){color:transparent;background:var(--surface-3)!important;cursor:pointer;user-select:none;position:relative}
.selftest table.cmp td:not(.shown)::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-weight:700;font-size:18px}
.common{display:flex;flex-direction:column;gap:8px}
.common li{font-size:14px}
.common ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* Flashcards */
.fc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.fc-stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.fc{perspective:1600px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc-inner{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);box-shadow:var(--shadow-2);min-height:330px;padding:28px 30px;display:flex;flex-direction:column;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.face .q{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,27px);line-height:1.35;margin-block:auto;text-wrap:balance}
.face .prompt{color:var(--faint);font-size:13px;display:flex;align-items:center;gap:6px}
.face .who{display:flex;gap:10px;align-items:center;font-weight:700}
.face .who .mono{width:34px;height:34px;font-size:13px}
.face .a{font-size:17px;line-height:1.6;margin-block:auto}
.fc-controls{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.fc-side{display:flex;flex-direction:column;gap:14px}
.fc-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fc-counts div{background:var(--surface-2);padding:8px;text-align:center}
.fc-counts b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.fc-counts span{font-size:12px;color:var(--muted)}
.kbd{display:inline-block;background:var(--surface-2);padding:0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Matching */
.game-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.stat{display:flex;align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .i{color:var(--muted)}
.match-board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(36px,9vw,120px);row-gap:10px;background:var(--surface);box-shadow:var(--shadow-1);padding:22px}
.match-col{display:flex;flex-direction:column;gap:10px;min-width:0;z-index:1}
.match-col h4{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:600;letter-spacing:.04em}
.mi{position:relative;text-align:left;padding:12px 14px;background:var(--surface-2);font-size:14px;line-height:1.4;min-height:52px;display:flex;align-items:center;transition:background .15s,color .15s,transform .12s;overflow-wrap:anywhere}
.mi:hover{background:var(--accent-soft)}
.mi.sel{background:var(--accent);color:var(--on-dark)}
.mi.done{color:var(--on-dark);pointer-events:none}
.mi.wrong{animation:shake .35s;background:var(--bad-bg)}
.match-lines{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;z-index:0}
.match-lines line{stroke-width:3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.result .big{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}

/* Memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;min-height:122px;perspective:900px;-webkit-tap-highlight-color:transparent}
.tile-in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.tile.open .tile-in,.tile.done .tile-in{transform:rotateY(180deg)}
.tile .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;box-shadow:var(--shadow-1)}
.tile .cover{background:var(--accent);color:rgba(255,255,255,.55)}
.tile .cover .i{width:30px;height:30px}
.tile .face2{background:var(--surface);transform:rotateY(180deg);font-size:13.5px;overflow:hidden;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tile.done .face2{color:var(--on-dark)}
.tile .kind{position:absolute;top:6px;left:8px;font-size:10.5px;font-weight:600;opacity:.6}

/* Order */
.order-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 12px;background:var(--surface-2);font-size:14px}
.slot .n{width:28px;height:28px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);font-weight:700;font-size:13px;flex:none}
.slot.filled{background:var(--good-bg)}
.slot.filled .n{background:var(--good);color:var(--on-dark)}
.slot.next{box-shadow:inset 0 0 0 2px var(--accent)}
.pool{display:flex;flex-direction:column;gap:6px}
.pool .mi{min-height:46px}
.pool .mi.hint{box-shadow:inset 0 0 0 3px var(--gold)}

/* Quiz */
.quiz-card{background:var(--surface);box-shadow:var(--shadow-2);padding:28px;display:flex;flex-direction:column;gap:18px;max-width:820px}
.quiz-q{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.3vw,24px);line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{text-align:left;padding:14px 16px;background:var(--surface-2);font-size:14.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;transition:background .15s}
.opt:hover{background:var(--accent-soft)}
.opt .letter{width:24px;height:24px;display:grid;place-items:center;background:var(--surface-3);font-weight:700;font-size:12px;flex:none}
.opt.right{background:var(--good);color:var(--on-dark)}
.opt.right .letter{background:rgba(255,255,255,.25)}
.opt.wrongpick{background:var(--bad);color:var(--on-dark)}
.opt.wrongpick .letter{background:rgba(255,255,255,.25)}
.opts.locked .opt{pointer-events:none}
.explain{background:var(--surface-2);padding:12px 14px;font-size:14px;display:flex;gap:10px}
.explain .i{margin-top:3px;flex:none}
.review{display:flex;flex-direction:column;gap:8px}
.review div{background:var(--surface-2);padding:10px 12px;font-size:14px}

/* Footer */
.foot{background:var(--surface);box-shadow:0 -1px 0 var(--surface-3)}
.foot .wrap{padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.foot-note{font-size:13px;color:var(--muted);max-width:52ch}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact-item{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;user-select:all;transition:background .15s}
a.contact-item:hover{background:var(--accent-soft)}
.contact-item .i{color:var(--accent)}
.copy-btn{min-height:38px;padding:8px 12px;box-shadow:none;background:var(--accent);color:var(--on-dark)}
@media (max-width:900px){
  .hero,.fc-wrap,.cmp-layout,.order-layout{grid-template-columns:minmax(0,1fr)}
  .cmp-menu{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .cmp-menu::-webkit-scrollbar{display:none}
  .cmp-item{white-space:nowrap;flex:none}
  .tgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  body{font-size:14.5px}
  .panel{padding:16px}
  .face{padding:22px 18px;min-height:300px}
  .fc-controls{grid-template-columns:auto 1fr 1fr auto}
  .opts{grid-template-columns:minmax(0,1fr)}
  .match-board{padding:14px}
  .mi{font-size:13px;padding:10px}
  .mem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{min-height:150px}
  .tile .face2{font-size:12.5px}
  .tile .face2.long{font-size:11.5px}
  .quiz-card{padding:20px 16px}
  .tc-head,.tc-body{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

const rendered = {};
function go(view, opts={}){
  if (!VIEWS.some(v => v[0] === view)) view = 'map';
  S.view = view;
  $$('[data-view]').forEach(s => s.hidden = s.id !== 'view-' + view);
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.go === view));
  const tab = $('#tab-' + view); if (tab) tab.scrollIntoView({block:'nearest', inline:'nearest'});
  if (!rendered[view] || opts.force) { RENDER[view](opts); rendered[view] = true; }
  else if (RENDER_ON_SHOW[view]) RENDER_ON_SHOW[view](opts);
  try { history.replaceState(null, '', '#' + view); } catch(e){}
  if (!opts.keepScroll) window.scrollTo({top: 0});
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }

  if (th) { e.preventDefault(); openThinker(th.dataset.thinker); return; }

function renderTimeline(){
  const y0 = 1850, y1 = 2000, span = y1 - y0;
  const pos = y => ((y - y0) / span * 100).toFixed(2) + '%';
  const list = T.slice().sort((a, b) => a.b - b.b);
  let ticks = '', grid = '';
  for (let y = y0; y <= y1; y += 25) { ticks += `<span class="tl-tick" style="left:${pos(y)}">${y}</span>`; grid += `<span class="tl-grid" style="left:${pos(y)}"></span>`; }
  const events = [[1896,'ფსიქოანალიზი'],[1911,'ადლერი'],[1913,'იუნგი'],[1939,'ფროიდი †']];
  const ev = events.map(e => `<span class="tl-event" style="left:${pos(e[0])}"><span>${e[0]} ${e[1]}</span></span>`).join('');
  const rows = list.map(t => {
    const end = t.d || y1;
    return `<div class="tl-row"><button class="tl-bar" data-thinker="${t.id}" style="left:${pos(t.b)};width:calc(${pos(end)} - ${pos(t.b)});background:${t.color}${t.d ? '' : ';opacity:.8'}" title="${esc(t.name)} ${t.years}">${esc(t.short)} · ${t.years}</button></div>`;
  }).join('');
  return `<div class="tl"><div class="tl-axis">${ticks}</div>${grid}${ev}<div style="position:relative;padding-top:14px">${rows}</div></div>`;
}

function deckOptions(){

  opts.push(['minor','სხვა ავტორები']);

}
function buildDeck(key){
  let list;
  if (key === 'all') list = CARDS;
  else if (key === 'weak') list = CARDS.filter(c => S.fcStatus[c.id] === 1);
  else if (key === 'new') list = CARDS.filter(c => !S.fcStatus[c.id]);
  else if (key === 'minor') list = CARDS.filter(c => M.some(m => m.id === c.deck));
  else list = CARDS.filter(c => c.deck === key);
  return shuffle(list);
}

function whoBlock(id){ const o = byId[id]; return o ? `<span class="who"><span class="mono" style="background:${o.color}">${o.mono}</span>${esc(o.name)}</span>` : ''; }
function drawCard(){
  const c = FC.deck[FC.i];
  FC.flipped = false; $('#fc').classList.remove('flipped');
  const k = FC.deck.filter(x => S.fcStatus[x.id] === 2).length, l = FC.deck.filter(x => S.fcStatus[x.id] === 1).length;
  $('#cK').textContent = k; $('#cL').textContent = l; $('#cN').textContent = FC.deck.length - k - l;
  if (!c) {
    $('#fcf').innerHTML = `<div class="empty">${S.fcDeck === 'weak' ? 'სუსტი ბარათები არ გაქვს. ყოჩაღ!' : 'ამ დასტაში ბარათი არ არის.'}</div>`;
    $('#fcb').innerHTML = ''; $('#fcpos').textContent = '0 / 0'; $('#fcbar').style.width = '0%';
    return;
  }
  const st = S.fcStatus[c.id];
  const stTag = st === 2 ? `<span class="tag" style="background:var(--good-bg);color:var(--good)">${ic('check','i-sm')}ვიცი</span>` : st === 1 ? `<span class="tag" style="background:var(--bad-bg);color:var(--bad)">სუსტი</span>` : `<span class="tag">ახალი</span>`;
  const prompt = c.kind === 'concept' ? 'ვისი ცნებაა და რას ნიშნავს?' : c.kind === 'term' ? 'რას ნიშნავს?' : 'გაიხსენე პასუხი';
  const frontTag = c.kind === 'concept' ? `<span class="tag">${ic('help','i-sm')}ცნება</span>` : `<span class="tag" style="color:${colorOf(c.who)}">${esc(byId[c.who].short)}</span>`;
  $('#fcf').innerHTML = `<div class="topline">${frontTag}${stTag}</div><div class="q">${esc(c.front)}</div><div class="prompt">${ic('rotate','i-sm')}${prompt} · დააჭირე გადასაბრუნებლად</div>`;
  $('#fcb').innerHTML = `<div class="topline">${whoBlock(c.who)}${stTag}</div><div class="a">${c.kind === 'concept' ? `<b>${esc(c.front)}</b> — ` : ''}${esc(c.back)}</div><div class="prompt">${ic('check','i-sm')}გაიხსენე? მონიშნე ქვემოთ</div>`;
  $('#fcpos').textContent = (FC.i + 1) + ' / ' + FC.deck.length;

}
function flip(){ if (!FC.deck[FC.i]) return; FC.flipped = !FC.flipped; $('#fc').classList.toggle('flipped', FC.flipped); }
function step(d){ if (!FC.deck.length) return; FC.i = (FC.i + d + FC.deck.length) % FC.deck.length; drawCard(); }
function mark(v){
  const c = FC.deck[FC.i]; if (!c) return;
  S.fcStatus[c.id] = v; saveFc();
  if (FC.i === FC.deck.length - 1) toast(v === 2 ? 'დასტის ბოლო ბარათი. თავიდან ვიწყებთ.' : 'დასტის ბოლო ბარათი.');
  step(1);
}
document.addEventListener('keydown', e => {
  if (S.view !== 'cards') return;

function quizPool(mode){
  const out = [];
  if (mode !== 'facts') {
    ALL.forEach(t => t.concepts.forEach(c => {
      const others = pick(ALL.filter(o => o.id !== t.id && o.school !== 'topic'), 3).map(o => o.short);
      out.push({q:`ვის ეკუთვნის ცნება „${clean(c[0])}“?`, a:t.short, opts:[t.short, ...others], ex:c[1], who:t.id});
    }));
    T.forEach(t => {
      if (t.concepts.length < 4) return;
      const c = t.concepts[Math.floor(Math.random() * t.concepts.length)];
      const others = pick(t.concepts.filter(x => x !== c), 3).map(x => clean(x[0]));
      out.push({q:`${t.short}: რომელ ცნებას შეესაბამება — „${c[1]}“`, a:clean(c[0]), opts:[clean(c[0]), ...others], ex:clean(c[0]) + ' — ' + c[1], who:t.id});
    });
    DEFENSES.forEach(d => { const others = pick(DEFENSES.filter(x => x !== d), 3).map(x => x[0]); out.push({q:`რომელი დაცვითი მექანიზმია: „${d[2]}“?`, a:d[0], opts:[d[0], ...others], ex:d[1], who:'defense'}); });
  }
  if (mode !== 'concepts') {
    ALL.forEach(t => (t.facts || []).forEach(f => out.push({q:f[0], a:f[1], opts:[f[1], ...f[2]], ex:'', who:t.id})));
    ERIKSON.forEach((e, i) => { const others = pick(ERIKSON.filter(x => x !== e), 3).map(x => x[1]); out.push({q:`რომელი სათნოება მიიღწევა სტადიაზე „${e[0]}“?`, a:e[1], opts:[e[1], ...others], ex:`${e[2]}; ${e[3]}`, who:'erikson'}); });
  }
  return out;
}

    $('#qex').innerHTML = `<div class="explain" style="${ok ? 'background:var(--good-bg)' : 'background:var(--bad-bg)'}">${ic(ok ? 'check' : 'x')}<div><b>${ok ? 'სწორია.' : 'სწორი პასუხი: ' + esc(q.a) + '.'}</b> ${ok ? exText : (q.ex ? exText : '')}${who ? ` <button class="btn flat" data-thinker="${who.id}" style="margin-top:8px;min-height:34px;padding:6px 12px">${ic('book','i-sm')}${esc(who.short)}: ბარათი</button>` : ''}</div></div>
      <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn primary" id="qnext">${QZ.i === QZ.qs.length - 1 ? 'შედეგი' : 'შემდეგი'}${ic('right','i-sm')}</button></div>`;
    $('#qnext').addEventListener('click', () => { QZ.i++; drawQ(); });
    $('#qnext').focus();
  });
}
function quizEnd(){
  const pct = Math.round(QZ.score / QZ.qs.length * 100);
  const rec = setBest('quiz', pct, (a, b) => a > b); renderStrip();
  $('#qbox').innerHTML = `<div class="quiz-card">
    <div class="result">${ic('trophy','i-lg')}<span class="big tab-nums">${QZ.score} / ${QZ.qs.length}</span><span class="muted">${pct}%${rec ? ' · ახალი რეკორდი' : ''}</span><span class="spacer"></span><button class="btn primary" id="qagain">${ic('shuffle','i-sm')}ახალი ქვიზი</button></div>
    ${QZ.wrong.length ? `<h3>გასამეორებელი</h3><div class="review">${QZ.wrong.map(w => `<div><b>${esc(w.q)}</b><br><span class="muted">${esc(w.a)}</span></div>`).join('')}</div>` : '<p class="muted">შეცდომა არ დაგიშვია. შემდეგ რაუნდში სხვა კითხვები შეგხვდება.</p>'}
  </div>`;
  $('#qagain').addEventListener('click', newQuiz);
}

/* ================= BOOT ================= */
const RENDER = {map:renderMap, thinkers:renderThinkers, compare:renderCompare, cards:renderCards, match:renderMatch, memory:renderMemory, order:renderOrder, quiz:renderQuiz};
const RENDER_ON_SHOW = {match:() => requestAnimationFrame(drawLines)};
$("#copy-email").addEventListener("click", () => {
  const email = $("#contact-email").textContent;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#contact-email")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("მისამართი მონიშნულია — დააკოპირეთ"); };
  try { navigator.clipboard.writeText(email).then(() => toast("ელფოსტა დაკოპირდა"), fallback); } catch (e) { fallback(); }
});
function start(){
  renderTabs(); renderStrip();
  const h = (location.hash || '').slice(1);
  go(VIEWS.some(v => v[0] === h) ? h : 'map', {keepScroll:true});
}
start();
</script>
